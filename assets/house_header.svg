<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f4b"/>
      <stop offset="0.6" stop-color="#6b3fa0"/>
      <stop offset="1" stop-color="#f4845f"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="70" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="28" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="60" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="34" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="830" cy="70" r="20" fill="#ffe9a8" opacity="0.9"/>

  <!-- title -->
  <text x="40" y="70" font-family="Georgia, serif" font-size="14" fill="#ffd9c7" letter-spacing="5">FOR SALE · AI VALUATION</text>
  <text x="40" y="118" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#ffffff">Robust Regression Engine</text>
  <text x="40" y="150" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#ffe3d3">So... what is this house really worth?</text>

  <!-- price tag -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 700 120;4 700 120;-4 700 120" dur="3s" repeatCount="indefinite"/>
    <line x1="700" y1="60" x2="700" y2="84" stroke="#ffffff" stroke-width="2"/>
    <rect x="650" y="84" width="100" height="52" rx="8" fill="#ffffff"/>
    <circle cx="700" cy="84" r="4" fill="#6b3fa0"/>
    <text x="700" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#6b3fa0">₹ ???</text>
  </g>

  <!-- skyline -->
  <g fill="#120d2b">
    <rect x="0" y="228" width="900" height="52"/>
    <!-- house 1 -->
    <polygon points="60,228 60,185 100,155 140,185 140,228"/>
    <!-- house 2 -->
    <polygon points="190,228 190,170 245,130 300,170 300,228"/>
    <!-- tower -->
    <rect x="340" y="140" width="60" height="88"/>
    <!-- house 3 -->
    <polygon points="450,228 450,180 495,148 540,180 540,228"/>
    <!-- tower 2 -->
    <rect x="580" y="165" width="50" height="63"/>
    <!-- house 4 -->
    <polygon points="670,228 670,190 710,162 750,190 750,228"/>
    <!-- house 5 -->
    <polygon points="780,228 780,200 815,176 850,200 850,228"/>
  </g>

  <!-- windows -->
  <g fill="#ffd166">
    <rect x="90" y="190" width="14" height="14"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="225" y="175" width="14" height="14"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="255" y="195" width="14" height="14"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="352" y="156" width="12" height="12"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="376" y="186" width="12" height="12"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="488" y="192" width="14" height="14"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="592" y="182" width="12" height="12"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="703" y="196" width="12" height="12"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="808" y="205" width="12" height="12"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></rect>
  </g>
</svg>
